<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공두일보</title>
<script src="shim.js"></script>
<style>
  :root {
    --bg: #f6f7fa; --panel: #ffffff; --panel2: #eef0f4; --line: #e3e6ec;
    --ink: #212633; --ink2: #4d5565; --ink3: #7f8793;
    --buy: #E8323C; --buy-bg: rgba(232,50,60,.09);
    --sell: #2F6BDB; --sell-bg: rgba(47,107,219,.09);
    --navy: #1b1f2d; --vix: #6d4fd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
         font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 15px; margin: 0 0 10px; font-weight: 700; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
  .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .title h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .title .date { color: var(--ink2); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .b-weekend { background: var(--navy); color: #fff; }
  .ctrl { display: flex; align-items: center; gap: 8px; color: var(--ink3); font-size: 12px; }
  select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .head { background: var(--navy); color: #fff; border: 0; }
  .head .hl { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .head .k3 { font-size: 12px; color: #aab0bc; font-weight: 700; margin-bottom: 4px; }
  .head ol { margin: 0; padding-left: 20px; }
  .head li { font-weight: 700; margin: 3px 0; }
  .head li .red { color: #ff5a63; font-weight: 800; }
  .idx { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ix { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .ix .t { padding: 12px 12px 10px; flex: 1; }
  .ix .k { font-size: 12px; color: var(--ink3); font-weight: 700; }
  .ix .v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; }
  .ix .c { font-size: 13px; font-weight: 700; }
  .ix .b { background: var(--panel2); padding: 8px 12px; font-size: 12px; color: var(--ink2); }
  .up { color: var(--buy); } .down { color: var(--sell); } .flat { color: var(--ink3); }
  .two { display: grid; grid-template-columns: 2fr 3fr; gap: 12px; }
  .sigbig { font-size: 30px; font-weight: 800; letter-spacing: -.02em; padding: 10px 0 4px; }
  .sigbig.BUY { color: var(--buy); } .sigbig.SELL { color: var(--sell); }
  .sub { color: var(--ink2); font-size: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
  .half .hp + .hp { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .half .sigbig { padding: 6px 0 2px; }
  .sched.schedrow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px; }
  .sched.schedrow li { border-bottom: 0; padding: 2px 0; }
  .news { list-style: none; margin: 0; padding: 0; }
  .news li { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .news li:last-child { border-bottom: 0; }
  .news .n { color: var(--ink3); font-weight: 700; min-width: 18px; }
  .news .top { background: var(--buy); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
  .news a { color: var(--ink); text-decoration: none; flex: 1; }
  .news a:hover { color: var(--sell); }
  .news .s { color: var(--ink3); font-size: 11px; white-space: nowrap; }
  .sched { list-style: none; margin: 0; padding: 0; }
  .sched li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .sched li:last-child { border-bottom: 0; }
  .sched .w { color: var(--ink3); font-size: 12px; font-weight: 700; }
  .sched .fp { color: var(--ink3); font-size: 12px; }
  .empty { color: var(--ink3); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink3); font-weight: 700; font-size: 12px; background: var(--panel2); }
  td:first-child { font-weight: 700; white-space: nowrap; }
  .tbl { overflow-x: auto; margin-bottom: 12px; }
  .conds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .cond { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .cond b { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
  .reason { font-size: 13px; color: var(--ink2); }
  footer { color: var(--ink3); font-size: 12px; text-align: center; padding: 8px 0 24px; }
  #msg { padding: 60px 0; text-align: center; color: var(--ink3); }
  /* VIX 차트 */
  .vh { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .vh .nm { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--vix); }
  .vq { font-weight: 800; font-variant-numeric: tabular-nums; }
  .tabs { display: inline-flex; gap: 4px; background: var(--panel2); padding: 3px; border-radius: 9px; }
  .tabs button { border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .vtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  #vcv { display: block; width: 100%; height: 230px; touch-action: none; cursor: crosshair; }
  .vhint { color: var(--ink3); font-size: 11px; margin-top: 2px; }
  @media (max-width: 760px) {
    .idx { grid-template-columns: repeat(2, 1fr); }
    .idx .ix:first-child { grid-column: 1 / -1; }
    .cols, .conds, .two { grid-template-columns: 1fr; }
    .sched.schedrow { grid-auto-flow: row; grid-auto-columns: auto; gap: 0; }
    .sched.schedrow li { border-bottom: 1px solid var(--line); padding: 7px 0; }
    .title h1 { font-size: 19px; }
    .ix .v { font-size: 18px; }
    .wrap { padding: 8px; }
    .card { padding: 13px; }
    #vcv { height: 200px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="msg">불러오는 중…</div>
  <div id="view"></div>
</div>
<script>
let DATES = [];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function mark(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="red">$1</span>'); }
function cls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
function pct(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%'; }

function tripodHtml(t, alertInfo) {
  let left, right;
  const sigPart = (t && t.now)
    ? '<h2>Tripod 현재 시그널</h2><div class="sigbig ' + esc(t.now.s) + '">' + esc(t.now.label) + '</div>' +
      '<div class="sub">발생 ' + esc(t.now.since) + (t.hold ? ' · 현재 보유 ' + esc(t.hold) : '') + '</div>'
    : '<h2>Tripod 현재 시그널</h2><div class="empty">시그널을 불러오지 못했습니다.</div>';
  const al = alertInfo;
  let alPart = '<h2>nasdaq-alert 최근 경보</h2>';
  if (!al) alPart += '<div class="empty">경보 데이터를 불러오지 못했습니다.</div>';
  else if (!al.alert) alPart += '<div class="empty">최근 경보 없음</div>';
  else alPart += '<div class="sigbig ' + esc(al.alert.s) + '">' + esc(al.alert.s) + ' ' + esc(al.alert.lv) + '</div>' +
    '<div class="sub">' + esc(al.alert.d) + ' · 종가 ' + al.alert.c.toFixed(1) + ' · RSI ' + al.alert.rsi.toFixed(1) + ' · %B ' + al.alert.pb.toFixed(2) + ' · %K ' + al.alert.k.toFixed(1) + ' · 이격도 ' + (al.alert.dp >= 0 ? '+' : '') + al.alert.dp.toFixed(1) + '%</div>';
  left = '<div class="card half"><div class="hp">' + sigPart + '</div><div class="hp">' + alPart + '</div></div>';
  let tr;
  if (t && t.trades && t.trades.length) {
    tr = '<h2>시그널 거래내역 (최근 3건)</h2><div class="tbl" style="margin:0"><table><tr><th>발생일</th><th>시그널</th><th>QQQ 가격</th><th>52주 고점 대비</th><th>VIX</th></tr>' +
      t.trades.map(r => '<tr><td>' + esc(r.d) + '</td><td class="' + (r.s === 'BUY' ? 'up' : 'down') + '" style="font-weight:700">' + esc(r.label) + '</td><td>' +
        (r.p == null ? '-' : '$' + r.p.toFixed(2)) + '</td><td class="' + (r.dd == null ? '' : cls(r.dd)) + '">' + (r.dd == null ? '-' : pct(r.dd)) + '</td><td>' + (r.vx == null ? '-' : r.vx.toFixed(2)) + '</td></tr>').join('') +
      '</table></div>';
  } else tr = '<h2>시그널 거래내역 (최근 3건)</h2><div class="empty">거래 내역이 없습니다.</div>';
  let nr = '<h2>nasdaq-alert 최근 경보 (최근 3건)</h2>';
  if (al && al.recent && al.recent.length) {
    nr += '<div class="tbl" style="margin:0"><table><tr><th>발생일</th><th>경보</th><th>종가</th><th>RSI</th><th>%B</th><th>%K</th><th>이격도</th></tr>' +
      al.recent.map(r => '<tr><td>' + esc(r.d) + '</td><td class="' + (r.s === 'BUY' ? 'up' : 'down') + '" style="font-weight:700">' + esc(r.s) + ' ' + esc(r.lv) + '</td><td>' + r.c.toFixed(1) + '</td><td>' + r.rsi.toFixed(1) + '</td><td>' + r.pb.toFixed(2) + '</td><td>' + r.k.toFixed(1) + '</td><td>' + (r.dp >= 0 ? '+' : '') + r.dp.toFixed(1) + '%</td></tr>').join('') +
      '</table></div>';
  } else nr += '<div class="empty">' + (al ? '최근 경보 없음' : '경보 데이터를 불러오지 못했습니다.') + '</div>';
  right = '<div class="card half"><div class="hp">' + tr + '</div><div class="hp">' + nr + '</div></div>';
  return '<div class="two">' + left + right + '</div>';
}

function render(d) {
  DATES = d.dates; const b = d.b;
  if (!b) { document.getElementById('msg').textContent = '브리핑이 아직 없습니다.'; return; }
  const opt = DATES.map(x => '<option value="' + esc(x) + '"' + (x === b.date ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  let h = '';
  h += '<header class="top"><div class="title"><h1>공두일보</h1><span class="date">' + esc(b.dateLabel) + '</span>' +
       (b.weekend ? '<span class="badge b-weekend">주말판</span>' : '') + '</div>' +
       '<div class="ctrl">지난 브리핑 <select onchange="load(this.value)">' + opt + '</select></div></header>';
  h += '<div class="card head"><div class="hl">' + esc(b.headline) + '</div><div class="k3">오늘 꼭 알아야 할 3줄</div><ol>' +
       b.lines.map(l => '<li>' + mark(l) + '</li>').join('') + '</ol></div>';
  h += '<div class="idx">' + b.idx.map(x => {
    const c = x.chgBp !== undefined
      ? '<span class="c ' + cls(x.chgBp) + '">' + (x.chgBp >= 0 ? '+' : '') + x.chgBp.toFixed(1) + 'bp</span>'
      : '<span class="c ' + cls(x.chg) + '">' + pct(x.chg) + '</span>';
    return '<div class="ix"><div class="t"><div class="k">' + esc(x.k) + '</div><div class="v">' + esc(x.v) + '</div>' + c +
           '</div><div class="b">' + esc(x.sub) + '</div></div>';
  }).join('') + '</div><div style="height:12px"></div>';
  h += tripodHtml(b.tripod, b.alert);
  h += '<div class="cols">' +
       '<div class="card"><div class="vh"><span class="nm"><i class="dot"></i>VIX 변동성지수 <span class="vq" id="vq"></span></span>' +
       '<span class="tabs" id="vtabs"></span></div>' +
       '<div class="vtools"><span class="tabs" id="vmode"></span><span class="tabs"><button data-z="in">＋ 확대</button><button data-z="out">－ 축소</button><button data-z="reset">초기화</button></span></div>' +
       '<canvas id="vcv"></canvas><div class="vhint">휠로 확대·축소 · 끌어서 이동 · 더블클릭 초기화 · 모바일은 두 손가락 · 기준 = 마지막 종가</div></div>' +
       '<div class="card"><h2>오늘의 뉴스 10</h2>' +
       (b.news.length ? '<ul class="news">' + b.news.map((n, i) =>
         '<li><span class="n">' + (i + 1) + '</span>' + (i < 3 ? '<span class="top">TOP</span>' : '') +
         '<a href="' + esc(/^https?:/i.test(n.l) ? n.l : '#') + '" target="_blank" rel="noopener">' + esc(n.t) + '</a><span class="s">' + esc(n.s) + '</span></li>'
       ).join('') + '</ul>' : '<div class="empty">뉴스를 불러오지 못했습니다.</div>') + '</div></div>';
  h += '<div class="card"><h2>' + (b.weekend ? '다음 주 미리보기' : '다음 일정 체크포인트') + '</h2>' +
       (b.sched.length ? '<ul class="sched schedrow">' + b.sched.map(s =>
         '<li><div class="w">' + esc(s.when) + ' (KST)</div><div>' + esc(s.t) + '</div>' +
         ((s.f || s.p) ? '<div class="fp">예상 ' + esc(s.f || '-') + ' · 이전 ' + esc(s.p || '-') + '</div>' : '') + '</li>'
       ).join('') + '</ul>' : '<div class="empty">예정된 미국 주요 지표가 없습니다.</div>') + '</div>';
  const o = b.opinion;
  h += '<div class="card"><h2>공두일보 투자의견</h2>' +
       '<div class="tbl"><table><tr><th>지표</th><th>값</th><th>판단</th></tr>' +
       o.table.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') +
       '</table></div><div class="conds">' +
       '<div class="cond"><b>보유자</b>' + esc(o.holder) + '</div>' +
       '<div class="cond"><b>신규 매수</b>' + esc(o.newBuy) + '</div>' +
       '<div class="cond"><b>의견 변경 조건</b>' + esc(o.change) + '</div></div>' +
       '<div class="reason"><b>근거</b> ' + esc(o.reason) + '</div></div>';
  h += '<footer>출처: ' + esc(b.sources) + '<br>생성 ' + esc(b.builtAt) + ' (KST) · 참고용 · 투자 권유 아님</footer>';
  document.getElementById('view').innerHTML = h;
  document.getElementById('msg').style.display = 'none';
  vInit();
}

function load(date) {
  document.getElementById('msg').style.display = 'block';
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(e => { document.getElementById('msg').textContent = '불러오기 실패: ' + (e && e.message ? e.message : e); })
    .gongdu_getData(date || '');
  window.scrollTo(0, 0);
}

/* ===== VIX 변동성지수 차트 (VIX 시그널 탭 상단 차트와 같은 데이터) ===== */
const TFS = [
  ['1h', '1시간', 'h', t => Math.floor(t / 3600)], ['4h', '4시간', 'h', t => Math.floor(t / 14400)],
  ['1d', '1일', 'd', t => Math.floor(t / 86400)], ['1w', '1주', 'w', t => Math.floor((t / 86400 + 3) / 7)],
  ['1mo', '1달', 'm', t => { const d = new Date(t * 1000); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }]
];
const VC = { tf: '1h', raw: null, live: null, v0: 0, v1: 0, hov: null, hy: null, pct: true, ptr: new Map(), pd: 0, drag: null };
const VBARS = 160, PADR = 92;
function agg(pts, key) { const out = []; for (const [t, c] of pts) { const k = key(t), l = out[out.length - 1]; if (l && l.k === k) { l.t = t; l.c = c; } else out.push({ k, t, c }); } return out; }
function vSeries() {
  if (!VC.raw) return { t: [], v: [] };
  const tf = TFS.find(x => x[0] === VC.tf), a = agg(VC.raw[tf[2]] || [], tf[3]);
  const t = a.map(x => x.t), v = a.map(x => x.c);
  if (VC.live != null && v.length) v[v.length - 1] = VC.live;
  return { t, v };
}
function vReset() { const n = vSeries().t.length; VC.v1 = n - 1; VC.v0 = Math.max(0, n - VBARS); }
function fmtT(t) {
  const o = VC.tf === '1mo' ? { year: 'numeric', month: '2-digit' } : (VC.tf === '1d' || VC.tf === '1w') ? { year: '2-digit', month: '2-digit', day: '2-digit' } : { month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false };
  return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', ...o }).format(new Date(t * 1000));
}
function vTabs() {
  const a = document.getElementById('vtabs'), m = document.getElementById('vmode'); if (!a) return;
  a.innerHTML = TFS.map(x => '<button data-tf="' + x[0] + '" class="' + (x[0] === VC.tf ? 'on' : '') + '">' + x[1] + '</button>').join('');
  m.innerHTML = '<button data-m="p" class="' + (VC.pct ? '' : 'on') + '">가격</button><button data-m="r" class="' + (VC.pct ? 'on' : '') + '">%</button>';
}
function vDraw() {
  const cv = document.getElementById('vcv'); if (!cv) return;
  const s = vSeries(), n = s.t.length; if (n < 2) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const base = s.v[n - 1], val = v => VC.pct ? (v / base - 1) * 100 : v;
  const i0 = Math.max(0, Math.floor(VC.v0)), i1 = Math.min(n - 1, Math.ceil(VC.v1));
  let lo = Infinity, hi = -Infinity;
  for (let i = i0; i <= i1; i++) { const q = val(s.v[i]); if (q < lo) lo = q; if (q > hi) hi = q; }
  const mg = (hi - lo) * 0.08 || 1; lo -= mg; hi += mg;
  const padB = 20, padT = 8, pw = W - PADR, ph = H - padT - padB, rg = Math.max(1e-6, VC.v1 - VC.v0);
  const X = i => (i - VC.v0) / rg * (pw - 6) + 3, Y = q => padT + (hi - q) / (hi - lo) * ph;
  const lab = q => VC.pct ? (q >= 0 ? '+' : '') + q.toFixed(2) + '%' : q.toFixed(2);
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim(), line = css('--line'), ink3 = css('--ink3'), col = css('--vix');
  x.font = '11px system-ui, sans-serif'; x.textBaseline = 'middle'; x.strokeStyle = line; x.fillStyle = ink3; x.textAlign = 'left'; x.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const q = lo + (hi - lo) * k / 4, y = Math.round(Y(q)) + .5; x.beginPath(); x.moveTo(0, y); x.lineTo(pw, y); x.stroke(); x.fillText(lab(q), pw + 8, y); }
  if (VC.pct && lo < 0 && hi > 0) { const y = Math.round(Y(0)) + .5; x.setLineDash([4, 3]); x.strokeStyle = ink3; x.beginPath(); x.moveTo(0, y); x.lineTo(pw, y); x.stroke(); x.setLineDash([]); }
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  const ticks = Math.max(2, Math.floor(pw / 150));
  for (let k = 0; k < ticks; k++) { const idx = Math.round(VC.v0 + (k + .5) / ticks * rg); if (idx >= 0 && idx < n) x.fillText(fmtT(s.t[idx]), X(idx), H - 5); }
  x.save(); x.beginPath(); x.rect(0, 0, pw, H); x.clip();
  x.beginPath(); let st = false;
