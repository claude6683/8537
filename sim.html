<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/shim.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation</title>
<style>
  :root {
    --bg: #f6f7fa; --panel: #ffffff; --panel2: #eef0f4; --line: #e3e6ec;
    --ink: #212633; --ink2: #4d5565; --ink3: #7f8793;
    --buy: #E8323C; --buy-bg: rgba(232,50,60,.09);      /* 상승·BUY = 빨강 */
    --sell: #2F6BDB; --sell-bg: rgba(47,107,219,.09);   /* 하락·SELL = 파랑 */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 12px; }
  .charts { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; margin-bottom: 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .tabs { display: flex; gap: 4px; background: var(--panel2); padding: 3px; border-radius: 9px; }
  .tabs button { border: 0; background: transparent; color: var(--ink2); font: inherit; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .hint { color: var(--ink3); font-size: 12px; }
  .pane-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0 2px; }
  .pane-h .name { font-weight: 700; }
  .pane-h .val { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink2); }
  .pane-h .val b { font-weight: 700; }
  canvas { display: block; width: 100%; touch-action: pan-y; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend i.sq { border-radius: 2px; width: 12px; height: 8px; opacity: .55; vertical-align: 0; }
  .vid { margin-top: 12px; text-align: center; }
  .vid .cap { color: var(--ink3); font-size: 12px; margin-bottom: 6px; }
  .vid .box { position: relative; width: min(100%, 320px); aspect-ratio: 9 / 16; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vb { font: inherit; font-size: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; }
  .vid a { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--ink3); }
  .sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .sum.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sum.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sc { min-width: 0; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px 8px; }
  .sc .n { font-size: clamp(10px, 1vw, 12px); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .sc .n i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .sc .f { white-space: nowrap; font-size: clamp(10px, 1.12vw, 17px); font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0; display: flex; flex-wrap: nowrap; align-items: baseline; gap: 0 8px; }
  .sc .d { font-size: clamp(9px, 0.95vw, 11.5px); color: var(--ink3); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .yt { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; }
  .yt h2 { font-size: 14px; margin: 0 0 6px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--ink3); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td.s { font-weight: 800; }
  .up { color: var(--buy); } .down { color: var(--sell); }
  .small { color: var(--ink3); font-size: 11.5px; margin-top: 6px; }
  .msg { padding: 30px 0; text-align: center; color: var(--ink3); }
  @media (max-width: 560px) { .sum { gap: 3px; } .sc { padding: 5px 5px 6px; } .sc .n { font-size: 9px; gap: 3px; } .sc .n i { width: 6px; height: 6px; } .sc .f { font-size: 9.5px; gap: 0 4px; flex-wrap: wrap; white-space: normal; } .sc .d { font-size: 7.5px; line-height: 1.35; } .sc .hint { display: none; } .tabs button { padding: 5px 9px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="sum" id="sum"></div>
  <section class="charts">
    <div class="top">
      <div class="tabs" id="kTabs"></div>
      <div class="tabs" id="mTabs"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div id="panes"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="charts" id="subsec"><div id="subs"></div></section>
    <div class="small" id="foot" style="margin:8px 2px"></div>
  </div>
<script>
const $ = id => document.getElementById(id);
const KINDS = [['T', 'Tripod']];
const MODES = [];
const HINTS = { F: '10년 전부터 시작 $100,000 · 기본 QQQM 보유 → VIX 급등 SELL이면 QQQM 50% + VOO 50%로 절반만 방어 → 안정되면 BUY로 QQQM 100% 복귀 · QQQM 200일선 위 눌림(VIX 급등)이면 ADD로 $200,000 추가 투입', T: '10년 전부터 시작 $100,000 · 나스닥100이 250일선 위(상승)면 VIX 10일평균 28 미만 + 낙폭 9% 이내일 때 TQQQ(3배), 아니면 QQQ(1배) · 250일선 아래(하락)면 VIX 25 미만일 때 QQQ(1배), 아니면 현금 · 신호 종가 확정, 다음 거래일 종가 체결 · 차트 표시는 체결일 기준' };
let kind = 'T', mode = 'tab', D = null, hov = null, seq = 0;
const cache = {};
const VIDS = {};   // 영상은 최종 확정 후 새로 만들어 연결
function vid() {}
function fmtD2(v) { return '$' + Number(v).toFixed(2); }
function scCard(s) {
  const p = [];
  if (s.inv != null) p.push('투입 ' + fmtD(s.inv) + ' · 손익 <span class="' + cls(s.pnl) + '">' + (s.pnl >= 0 ? '+' : '-') + fmtD(Math.abs(s.pnl)) + '</span>');
  if (s.mdd != null) p.push('최대낙폭 <span class="down">' + s.mdd.toFixed(1) + '%</span>');
  if (s.trades != null) p.push('전환 ' + s.trades + '회' + (s.adds ? ' · 추가 투입 ' + s.adds + '회' : ''));
  return '<div class="sc"><div class="n"><i style="background:' + s.c + '"></i>' + s.n + '</div><div class="f"><span>' + fmtD(s.final) + '</span><span class="' + cls(s.tot) + '">' + pc(s.tot) + '</span>' + (s.cagr != null ? '<span class="' + cls(s.cagr) + '">연 ' + pc(s.cagr) + '</span>' : '') + '</div><div class="d">' + p.join(' · ') + '</div></div>';
}
function ingCard(ing) {
  return '<div class="sc"><div class="n"><i style="background:#16a34a"></i>Position</div>' + (ing.length ? ing.map(x => '<div class="f"><span>' + x.t + '</span><span>' + fmtD2(x.p) + '</span></div><div class="d">구매 ' + x.d + ' · 현재 ' + fmtD2(x.cur) + ' <span class="' + cls(x.cur / x.p - 1) + '">' + pc((x.cur / x.p - 1) * 100) + '</span></div>').join('') : '<div class="d">-</div>') + '</div>';
}
// 상단 3칸: Position / Tripod 전략 / VIX 공격적 전략 (어느 탭이든 항상 표시)
function topSum() {
  const T = cache['T_tab'];
  let s = '';
  if (T && T.ing) s += ingCard(T.ing);
  if (T && T.sum && T.sum[0]) s += scCard(T.sum[0]);
  $('sum').className = 'sum c2'; $('sum').innerHTML = s;
}

/* ===== Tripod 탭: QQQ / QLD / TQQQ 캔들 차트 + BUY/SELL ===== */
const NM = { Q: 'QQQ', L: 'QLD', T: 'TQQQ', C: '현금' };
const SLM = { CQ: 'buy1단계', QT: 'buy 확정', TQ: '공포', QC: '과매도', CT: 'buy 확정', TC: '과매도' };
const SL = (f, t) => SLM[f + t] || (NM[f] + ' → ' + NM[t]);
const QSYM = ['QQQ', 'SGOV'], QC = {};
QSYM.forEach(s => { QC[s] = { tf: s === 'SGOV' ? '1w' : '1d', raw: {}, live: null, v: null }; });
const QCT = [['1h', '1시간'], ['1d', '1일'], ['1w', '1주']];
const QCH = 224;
function qcHtml() {
  return QSYM.map(s => s === 'SGOV' ? '<div class="qc" data-sym="SGOV" style="margin-bottom:10px"><div class="pane-h"><span class="name">현금 (SGOV) <span id="qcP_SGOV">-</span> · VIX <span id="qcV_SGOV">-</span></span><span class="hint" id="qcL_SGOV" style="display:block;margin-top:3px"></span></div></div>' : '<div class="qc" data-sym="' + s + '" style="margin-bottom:10px"><div class="pane-h"><span class="name">' + (s === 'SGOV' ? '현금 (SGOV)' : s) + ' <span id="qcP_' + s + '">-</span> · VIX <span id="qcV_' + s + '">-</span></span></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px"><span class="tabs" id="qcTabs_' + s + '"></span><span class="tabs"><button data-z="in">＋ 확대</button><button data-z="out">－ 축소</button><button data-z="reset">처음</button></span></div><canvas id="qcv_' + s + '" style="height:' + QCH + 'px;cursor:grab"></canvas></div>').join('')
    + '<div class="legend"><span><i style="background:var(--buy)"></i>▲ 이 종목으로 갈아탐</span><span><i style="background:var(--sell)"></i>▼ 이 종목에서 갈아탐 (라벨 = 시그널, 체결일 기준)</span></div><div class="hint" style="margin-bottom:6px">마우스 휠 / 두 손가락으로 확대·축소 · 좌우로 끌어 과거 데이터 보기</div>';
}
function qcTabs(s) { const el = $('qcTabs_' + s); if (el) el.innerHTML = QCT.map(t => '<button data-q="' + t[0] + '" class="' + (t[0] === QC[s].tf ? 'on' : '') + '">' + t[1] + '</button>').join(''); }
function qcInit() { QSYM.forEach(s => { qcTabs(s); qcLoad(s); }); }
document.addEventListener('click', e => {
  const w = e.target.closest && e.target.closest('.qc'); if (!w) return; const s = w.dataset.sym;
  const b = e.target.closest('[data-q]');
  if (b) { QC[s].tf = b.dataset.q; QC[s].v = null; qcTabs(s); qcLoad(s); return; }
  const z = e.target.closest('[data-z]');
  if (z) { if (z.dataset.z === 'in') qcZoom(s, 1 / 1.5, .5); else if (z.dataset.z === 'out') qcZoom(s, 1.5, .5); else { QC[s].v = null; qcDraw(s); } }
});
function qcLoad(s) {
  const tf = QC[s].tf;
  if (QC[s].raw[tf]) qcDraw(s);
  google.script.run.withSuccessHandler(d => { if (d && d.p && d.p.length) { QC[s].raw[d.tf] = d.p; if (d.live) QC[s].live = d.live; QSYM.forEach(k => { if (QC[k].raw[QC[k].tf]) qcDraw(k); }); } }).sim_getQ(s, tf);
}
function qcView(s, len) {
  const c = QC[s], d = { '1h': 90, '1d': 120, '1w': 104 }[c.tf];
  if (!c.v || c.v.tf !== c.tf) c.v = { tf: c.tf, cnt: Math.min(d, len), off: 0 };
  const v = c.v; v.cnt = Math.max(15, Math.min(len, Math.round(v.cnt))); v.off = Math.max(0, Math.min(len - v.cnt, Math.round(v.off)));
  return v;
}
function qcZoom(s, f, fx) {
  const rows = QC[s].raw[QC[s].tf]; if (!rows) return; const v = qcView(s, rows.length), len = rows.length;
  const left = len - v.off - v.cnt, anchor = left + fx * v.cnt, nc = Math.max(15, Math.min(len, Math.round(v.cnt * f)));
  v.off = len - nc - (anchor - fx * nc); v.cnt = nc; qcView(s, len); qcDraw(s);
}
function qcDraw(s) {
  if (!s) { QSYM.forEach(qcDraw); return; }
  const cv = $('qcv_' + s); if (kind !== 'T' || !D) return; if (!cv && s !== 'SGOV') return;
  const c = QC[s], rows = c.raw[c.tf]; if (!rows) return;
  const V = qcView(s, rows.length), R = rows.slice(rows.length - V.off - V.cnt, rows.length - V.off), n = R.length, last = rows[rows.length - 1];
  $('qcP_' + s).textContent = '$' + Number(c.live || last[4]).toFixed(2);
  let vx = [...rows].reverse().find(r => r[5] != null); if (!vx) { for (const k of QSYM) { const rr = QC[k].raw['1d']; const f = rr && [...rr].reverse().find(r => r[5] != null); if (f) { vx = f; break; } } } $('qcV_' + s).textContent = vx ? vx[5].toFixed(2) : '-';
  if (s === 'SGOV' && $('qcL_SGOV')) { const MK = D.marks || [], lc = [...MK].reverse().find(q => q.f === 'C' || q.t === 'C') || MK[MK.length - 1]; $('qcL_SGOV').textContent = lc ? '마지막 거래 ' + dstr(D.T[lc.k]) + ' · ' + SL(lc.f, lc.t) : '거래 내역 없음'; }
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const padR = 54, padB = 20, padT = 24, pw = W - padR, ph = H - padT - padB - 12;
  let lo = Infinity, hi = -Infinity; R.forEach(r => { if (r[3] < lo) lo = r[3]; if (r[2] > hi) hi = r[2]; });
  const mg = (hi - lo) * .06 || 1; lo -= mg; hi += mg;
  cv._pw = pw;
  const X = i => (i + .5) / n * pw, Y = v => padT + (hi - v) / (hi - lo) * ph;
  g.font = '11px sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineWidth = 1;
  ticks(lo, hi, false).forEach(v => { const y = Math.round(Y(v)) + .5; g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(0, y); g.lineTo(pw, y); g.stroke(); g.fillStyle = css('--ink3'); g.fillText('$' + Math.round(v), pw + 5, y); });
  const cw = Math.max(1.5, pw / n * .62), up = css('--buy'), dn = css('--sell');
  R.forEach((r, i) => {
    const cl = r[4] >= r[1] ? up : dn, x = X(i);
    g.strokeStyle = cl; g.fillStyle = cl; g.beginPath(); g.moveTo(Math.round(x) + .5, Y(r[2])); g.lineTo(Math.round(x) + .5, Y(r[3])); g.stroke();
    const y1 = Y(Math.max(r[1], r[4])), y2 = Y(Math.min(r[1], r[4])); g.fillRect(x - cw / 2, y1, cw, Math.max(1, y2 - y1));
  });
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = css('--ink3');
  [0, Math.floor(n / 3), Math.floor(n * 2 / 3), n - 1].forEach(i => { const d = new Date(R[i][0] * 1000 + 9 * 3600000); g.fillText((R[n - 1][0] - R[0][0] > 400 * 86400 ? "'" + String(d.getUTCFullYear()).slice(2) + '/' : '') + (d.getUTCMonth() + 1) + '/' + d.getUTCDate(), Math.max(14, Math.min(pw - 14, X(i))), H - 4); });
  const span = (c.tf === '1w' ? 8 : 2) * 86400;
  g.font = 'bold 10px sans-serif'; g.textAlign = 'center'; g.lineJoin = 'round'; const PL = [];
  const CODE = { QQQ: 'Q', QLD: 'L', TQQQ: 'T', SGOV: 'C' }[s];
  (D.marks || []).forEach(m => {
    const buy = m.t === CODE; if (!buy && m.f !== CODE) return;
    const td = D.T[m.k] * 86400 + 23 * 3600; let lo2 = 0, hi2 = n - 1, j = -1;
    while (lo2 <= hi2) { const md = (lo2 + hi2) >> 1; if (R[md][0] <= td) { j = md; lo2 = md + 1; } else hi2 = md - 1; }
    if (j < 0 || td - R[j][0] > span) return;
    const x = X(j), cl = ({ C: 0, Q: 1, L: 2, T: 3 })[m.t] > ({ C: 0, Q: 1, L: 2, T: 3 })[m.f] ? up : dn, y = buy ? Y(R[j][3]) + 5 : Y(R[j][2]) - 5, d = buy ? 1 : -1;
    g.fillStyle = cl; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 6, y + 11 * d); g.lineTo(x + 6, y + 11 * d); g.closePath(); g.fill();
    const lb = SL(m.f, m.t), lw = g.measureText(lb).width + 4;
    let row = 0, ly = 0; for (; row < 6; row++) { ly = y + (21 + row * 14) * d; if (!PL.some(p => p.d === d && p.r === row && Math.abs(p.x - x) < (p.w + lw) / 2)) break; }
    if (row < 6 && ly > 6 && ly < H - padB - 2) { PL.push({ x: x, w: lw, d: d, r: row }); const lx = Math.max(lw / 2, Math.min(pw - lw / 2, x)); g.textBaseline = 'middle'; g.lineWidth = 3; g.strokeStyle = '#fff'; g.strokeText(lb, lx, ly); g.fillStyle = cl; g.fillText(lb, lx, ly); g.lineWidth = 1; }
  });
}
window.addEventListener('resize', () => qcDraw());
(function () {
  const P = {}, PS = {};
  const isC = e => e.target && e.target.id && e.target.id.indexOf('qcv_') === 0;
  document.addEventListener('wheel', e => { if (!isC(e)) return; e.preventDefault(); qcZoom(e.target.id.slice(4), e.deltaY > 0 ? 1.2 : 1 / 1.2, Math.max(0, Math.min(1, e.offsetX / (e.target._pw || e.target.clientWidth)))); }, { passive: false });
  document.addEventListener('pointerdown', e => { if (!isC(e)) return; P[e.pointerId] = e.clientX; PS[e.pointerId] = e.target.id.slice(4); try { e.target.setPointerCapture(e.pointerId); } catch (x) {} });
  document.addEventListener('pointermove', e => {
    if (P[e.pointerId] == null) return;
    const s = PS[e.pointerId], cv = $('qcv_' + s), rows = QC[s].raw[QC[s].tf]; if (!cv || !rows) return;
    const ids = Object.keys(P).filter(k => PS[k] === s), v = qcView(s, rows.length), pw = cv._pw || cv.clientWidth;
    if (ids.length >= 2) {
      const o = ids.find(k => +k !== e.pointerId), d0 = Math.abs(P[e.pointerId] - P[o]), d1 = Math.abs(e.clientX - P[o]);
      P[e.pointerId] = e.clientX; if (d0 > 8 && d1 > 8) { const r = cv.getBoundingClientRect(); qcZoom(s, d0 / d1, Math.max(0, Math.min(1, ((e.clientX + P[o]) / 2 - r.left) / pw))); }
      return;
    }
    const step = pw / v.cnt, bars = Math.trunc((e.clientX - P[e.pointerId]) / step);
    if (bars !== 0) { v.off += bars; P[e.pointerId] += bars * step; qcDraw(s); }
  });
  const up = e => { delete P[e.pointerId]; delete PS[e.pointerId]; };
  document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
})();

function fmtD(v, f) { if (f === '#') return Math.round(v).toLocaleString('en-US'); return f === '$2' ? '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + Math.round(v).toLocaleString('en-US'); }
function pc(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function cls(v) { return v >= 0 ? 'up' : 'down'; }
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function dstr(ed) { const d = new Date(ed * 86400000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }

function tabs() {
  $('kTabs').innerHTML = KINDS.map(k => '<button data-k="' + k[0] + '" class="' + (k[0] === kind ? 'on' : '') + '">' + k[1] + '</button>').join('');
  $('mTabs').innerHTML = MODES.map(m => '<button data-m="' + m[0] + '" class="' + (m[0] === mode ? 'on' : '') + '">' + m[1] + '</button>').join('');
}
$('kTabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { kind = b.dataset.k; load(); } });
$('mTabs').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { mode = b.dataset.m; load(); } });

function load() {
  tabs(); hov = null; vid();
  $('hint').textContent = HINTS[kind];
  const key = kind + '_' + mode, my = ++seq;
  if (cache[key]) { D = cache[key]; render(); return; }
  $('panes').innerHTML = '<div class="msg">계산 중… (처음 한 번은 10~20초)</div>';
  google.script.run
    .withSuccessHandler(d => { if (my !== seq) return; if (!d) { $('panes').innerHTML = '<div class="msg">데이터를 불러오지 못했습니다. 잠시 후 다시 시도하세요.</div>'; return; } cache[key] = d; D = d; render(); })
    .withFailureHandler(err => { if (my === seq) $('panes').innerHTML = '<div class="msg">불러오기 실패: ' + (err && err.message || err) + '</div>'; })
    .sim_get(kind, mode);
}

function render() {
  if (!D) return;
  const dn = kind === 'T' ? 'QQQ' : 'QQQM';
  const mkPane = (p, i, hh) => '<div class="pane-h"><span class="name">' + p.title + '</span><span class="val" id="hv' + i + '"></span></div><canvas id="cv' + i + '" style="height:' + hh + 'px"></canvas>';
  $('panes').innerHTML = (kind === 'T' ? qcHtml() : '') + D.panes.map((p, i) => mkPane(p, i, kind === 'T' ? 252 : 360)).join('');
  $('subsec').style.display = kind === 'T' ? 'none' : '';
  if (kind === 'T') { $('subs').innerHTML = ''; qcInit(); } else $('subs').innerHTML = (D.subs || []).map((p, j) => mkPane(p, D.panes.length + j, 220)).join('');
  let lg = D.panes[0].lines.map(l => '<span><i style="background:' + l.c + '"></i>' + l.n + '</span>').join('');
  lg += '<span><i style="background:var(--buy)"></i>BUY (QQQM 복귀)</span><span><i style="background:var(--sell)"></i>SELL (방어로)</span><span><i style="background:#16a34a"></i>ADD (추가 투입)</span>';
  lg += '<span><i class="sq" style="background:var(--buy)"></i>QQQM 보유</span><span><i class="sq" style="background:var(--sell)"></i>방어 (QQQM 50% + VOO 50%)</span>';
  if (kind === 'T') lg = D.panes[0].lines.map(l => '<span><i style="background:' + l.c + '"></i>' + l.n + '</span>').join('') + '<span><i style="background:var(--buy)"></i>레버리지 확대 (라벨 = 시그널)</span><span><i style="background:var(--sell)"></i>레버리지 축소</span><span><i class="sq" style="background:var(--buy)"></i>TQQQ 100% (3배)</span><span><i class="sq" style="background:#16a34a"></i>QQQ 100% (1배)</span><span><i class="sq" style="background:var(--sell)"></i>현금 (SGOV)</span>';
  $('legend').innerHTML = lg; topSum();
  function fmtD2(v) { return '$' + Number(v).toFixed(2); }
  const nHi = D.rows.filter(r => r.v[0] - r.v[1] >= 0.05).length, nLo = D.rows.filter(r => r.v[0] - r.v[1] <= -0.05).length;
  let ft = '전략이 ' + dn + ' 보유보다 높은 해 ' + nHi + '번 · 낮은 해 ' + nLo + '번 · 같은 해 ' + (D.rows.length - nHi - nLo) + '번 (올해는 진행 중) · 차이는 %p(수익률의 차) · 시작 ' + D.start + ' (10년 전 이후 첫 거래일) · 최신 ' + D.end + ' · 갱신 ' + D.at + ' · 현재 ' + (D.now.inQ ? 'QQQM 보유 중' : '방어(QQQM 50% + VOO 50%) 보유 중') + (D.now.since ? ' (' + D.now.lastSig + ' ' + D.now.since + ')' : '');
  ft += ' · 신호: SELL = VIX/20일평균 ≥ 1.15 & VIX ≥ 20 & QQQM 200일선 아래 / BUY = VIX ≤ 16 또는 VIX/20일평균 ≤ 0.9 / ADD = 보유 중 VIX 급등인데 200일선 위(눌림)이면 $200,000 추가 · 전환 간 최소 20거래일 · 신호 봉 종가 체결';
  ft += ' · 연수익은 투입 시점을 반영한 IRR, 연도별 수익률은 투입금 영향 제외 · 배당 포함 수정종가 · QQQM은 2020-10 이전 QQQ로 이어 붙임 · 세금·수수료 제외 · 과거 성과이며 미래를 보장하지 않음';
  if (kind === 'T') ft = tFoot(nHi, nLo);
  $('foot').textContent = ft;
  draw();
}

function tFoot(nHi, nLo) {
  const N = D.now;
  return 'Tripod 전략이 QQQ 보유보다 높은 해 ' + nHi + '번 · 낮은 해 ' + nLo + '번 · 같은 해 ' + (D.rows.length - nHi - nLo) + '번 (올해는 진행 중) · 시작 ' + D.start + ' · 최신 ' + D.end + ' · 갱신 ' + D.at + ' · 현재 ' + N.name + ' 보유 중 (' + N.since + ' 체결)' + (N.pend ? ' · 신호 대기: 다음 거래일에 ' + N.pend + '로 전환' : '') + ' · 시장 상태: 나스닥100(^NDX)이 250일선 ×1.01 위면 상승, ×0.95 아래면 하락, 그 사이는 직전 상태 유지 · 상승장: VIX 10일평균 < 28 이고 52주 고점 대비 낙폭 9% 이내면 TQQQ 100%(3배), 아니면 QQQ 100%(1배) · 하락장: VIX 10일평균 < 25이면 QQQ 100%(1배), 아니면 현금(SGOV) · 차트 라벨 = 시그널(buy1단계·buy 확정·공포·과매도), 빨강 = 레버리지 확대, 파랑 = 축소 · 신호는 종가에 확정되고 체결은 다음 거래일 종가(차트 표시는 체결일) · 거래비용 3bp · 배당 포함 수정종가 · 세금 제외 · 과거 성과이며 미래를 보장하지 않음';
}

function ticks(lo, hi, log) {
  const t = [];
  if (log) { for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) [1, 1.5, 2, 3, 5, 7].forEach(m => { const v = m * Math.pow(10, e); if (v >= lo && v <= hi) t.push(v); }); if (t.length > 8) return t.filter((_, i) => i % 2 === 0); return t; }
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) t.push(v);
  return t;
}

function draw() {
  if (!D) return;
  D.panes.concat(D.subs || []).forEach((p, pi) => {
    const cv = $('cv' + pi); if (!cv) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const n = D.T.length, padR = 62, padB = 20, padT = 8, pw = W - padR, ph = H - padT - padB;
    let lo = Infinity, hi = -Infinity;
    p.lines.forEach(l => l.v.forEach(x => { if (x < lo) lo = x; if (x > hi) hi = x; }));
    const log = !!p.log && lo > 0;
    const f = log ? Math.log : (x => x);
    if (!log) { const m = (hi - lo) * .08 || 1; lo -= m; hi += m; }
    const a = f(lo), b = f(hi), X = i => (i + .5) / n * pw, Y = v => padT + (b - f(v)) / (b - a || 1) * ph;
    // 보유 구간 음영 (BUY=QQQM/TQQQ 보유=빨강, SELL=VOO·SCHD/현금=파랑)
    (p.shade || D.shade).forEach(s => { g.fillStyle = s.s === 'BUY' ? 'rgba(232,50,60,.07)' : s.s === 'MID' ? 'rgba(245,158,11,.09)' : s.s === 'LOW' ? 'rgba(22,163,74,.09)' : 'rgba(47,107,219,.07)'; g.fillRect(X(s.a) - pw / n / 2, padT, (s.b - s.a + 1) * pw / n, ph); });
    // 격자 + 가격축
    g.font = '11px sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineWidth = 1;
    ticks(lo, hi, log).forEach(v => { const y = Math.round(Y(v)) + .5; g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(0, y); g.lineTo(pw, y); g.stroke(); g.fillStyle = css('--ink3'); g.fillText(p.fmt === '#' ? Math.round(v).toLocaleString('en-US') : p.fmt === '$2' ? '$' + (v >= 100 ? Math.round(v) : v.toFixed(v < 10 ? 2 : 1)) : (v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + Math.round(v / 1000) + 'K'), pw + 5, y); });
    // 연도 눈금
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = css('--ink3');
    let lastY = '';
    D.T.forEach((ed, i) => { const y = dstr(ed).slice(0, 4); if (y !== lastY) { lastY = y; const x = X(i); g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(Math.round(x) + .5, padT); g.lineTo(Math.round(x) + .5, padT + ph); g.stroke(); if (x > 14 && x < pw - 14) g.fillText("'" + y.slice(2), x, H - 5); } });
    // 선
    p.lines.forEach(l => {
      g.strokeStyle = l.c; g.lineWidth = l.w; g.lineJoin = 'round'; g.beginPath();
      l.v.forEach((v, i) => { const x = X(i), y = Y(v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    });
    // BUY/SELL 동그라미 (m 표시된 선 위)
    const ml = p.lines.find(l => l.m);
    if (ml) {
      const MK = p.marks || D.marks, placed = [], colOf = s => s === 'BUY' ? css('--buy') : (s === 'ADD' ? '#16a34a' : css('--sell'));
      MK.forEach(m => {
        const x = X(m.k), y = Y(ml.v[m.k]);
        g.fillStyle = colOf(m.s); g.strokeStyle = '#fff'; g.lineWidth = 1.5;
        g.beginPath(); g.arc(x, y, 4.2, 0, 7); g.fill(); g.stroke();
      });
      // 문자 라벨: SELL 은 선 위쪽, BUY·ADD 는 선 아래쪽 (겹치면 비켜 놓고, 그래도 겹치면 생략)
      g.font = 'bold 9px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      MK.forEach(m => {
        const x = X(m.k), y = Y(ml.v[m.k]), lab = (m.f && m.t) ? SL(m.f, m.t) : m.s, tw = g.measureText(lab).width + 8, h = 13, up = m.s === 'SELL';
        const bx = Math.max(1, Math.min(pw - tw - 1, x - tw / 2));
        let done = false;
        for (const sd of [up, !up]) {
          for (let t = 0; t < 8; t++) {
            const by = sd ? y - 8 - h - t * (h + 2) : y + 8 + t * (h + 2);
            if (by < padT || by + h > padT + ph) break;
            if (placed.some(q => bx < q.x + q.w + 1 && q.x < bx + tw + 1 && by < q.y + q.h + 1 && q.y < by + h + 1)) continue;
            placed.push({ x: bx, y: by, w: tw, h: h });
            g.strokeStyle = colOf(m.s); g.lineWidth = 1; g.beginPath(); g.moveTo(x, y + (sd ? -5 : 5)); g.lineTo(x, sd ? by + h : by); g.stroke();
            g.fillStyle = '#fff'; g.beginPath(); g.roundRect(bx, by, tw, h, 3); g.fill(); g.stroke();
            g.fillStyle = colOf(m.s); g.fillText(lab, bx + tw / 2, by + h / 2 + .5);
            done = true; break;
          }
          if (done) break;
        }
      });
      g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.font = '11px sans-serif';
    }
    // 십자선
    if (hov != null) {
      const x = X(hov); g.strokeStyle = 'rgba(33,38,51,.45)'; g.lineWidth = 1; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + ph); g.stroke(); g.setLineDash([]);
      p.lines.forEach(l => { g.fillStyle = l.c; g.beginPath(); g.arc(x, Y(l.v[hov]), 3.2, 0, 7); g.fill(); });
    }
    const hv = $('hv' + pi); if (hv) {
      const i = hov != null ? hov : n - 1;
      hv.innerHTML = '<span style="color:var(--ink3)">' + dstr(D.T[i]) + '</span> ' + p.lines.map(l => '<span style="color:' + l.c + '">●</span> ' + l.n + ' <b>' + fmtD(l.v[i], p.fmt) + '</b>').join(' &nbsp; ');
    }
    cv._geo = { pw, n };
  });
}

function onMove(e) {
  const cv = e.currentTarget, r = cv.getBoundingClientRect(), g = cv._geo; if (!g) return;
  const x = e.clientX - r.left;
  hov = Math.max(0, Math.min(g.n - 1, Math.floor(x / g.pw * g.n))); draw();
}
document.addEventListener('pointermove', e => { if (e.target.tagName === 'CANVAS') onMove({ currentTarget: e.target, clientX: e.clientX }); });
document.addEventListener('pointerleave', () => { hov = null; draw(); }, true);
window.addEventListener('resize', draw);
load();
</script>
</body>
