name: refresh
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '비우면 일반 실행, all=전부 새로 계산, build=공두일보 새로 작성'
        default: ''
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 시세·브리핑 계산
        run: node server/export.mjs
        env:
          FORCE: ${{ github.event.inputs.force }}
      - name: 나스닥 일봉 수집 (nasdaq-alert)
        run: |
          node -e "fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5EIXIC?range=10y&interval=1d',{headers:{'User-Agent':'Mozilla/5.0'}}).then(r=>r.json()).then(j=>{if(!(j&&j.chart&&j.chart.result))throw 1;require('fs').writeFileSync('data/ixic.json',JSON.stringify(j))}).catch(()=>console.log('ixic skip'))"
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data store
          if ! git diff --cached --quiet; then
            git commit -q -m "data refresh"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs -q && git push -q; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi
